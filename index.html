<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCS Command — Internal Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Password gate (client-side, shared team password — v1 only, not real auth) -->
<div id="gate" class="gate">
  <div class="gate-box">
    <img src="assets/logo.png" alt="Tort Claim Strategies">
    <div class="gate-sub">Internal Command Dashboard</div>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-pw" placeholder="Team password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <div id="gate-err" class="gate-err hidden">Wrong password.</div>
  </div>
</div>

<div id="app" class="wrap hidden">

  <!-- Left sidebar nav (added Aug 11 2026) -->
  <nav class="sidebar">
    <div class="sb-brand">
      <img src="assets/logo.png" alt="TCS">
      <span>Tort Claim<br>Strategies</span>
    </div>
    <div class="navitem active" data-page="dashboard"><span class="ico">▦</span> Dashboard</div>
    <div class="navitem" data-page="meta"><span class="ico">📣</span> Meta Ads</div>
    <div class="navitem" data-page="youtube"><span class="ico">▶</span> YouTube Ads</div>
    <div class="navitem" onclick="window.location.href='utm.html'"><span class="ico">🏷</span> UTM Content</div>
    <div class="navitem" onclick="window.location.href='bp-utm.html'"><span class="ico">📊</span> BP UTM</div>
    <div class="sb-foot">v1 · internal</div>
  </nav>

  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="Tort Claim Strategies">
      <div class="sub">Internal Command Dashboard</div>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>

  <div id="loading" class="loading">Loading dashboard data…</div>
  <div id="content"></div>

  <footer id="footer">TCS Internal · auto-refresh hourly (LP/BP/Meta/SR) · retainers daily · <span class="amber-text">shared-password access</span></footer>
</div>

<div id="refresh-badge" class="refresh-badge hidden">refreshing…</div>

<script src="app.js"></script>
</body>
</html>
