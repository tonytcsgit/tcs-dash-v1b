<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTM Content Analysis — TCS</title>
<link rel="stylesheet" href="styles.css">
<style>
/* UTM Analysis — matches utm_analysis.py output format */
.utm-controls { background: var(--bg2); border: 1px solid var(--line-dark); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; }
.utm-controls-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.utm-controls label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.utm-controls select { background: #0b0e13; border: 1px solid var(--line-dark); border-radius: 8px; color: #e8eef5; padding: 8px 12px; font-size: 13px; outline: none; }
.utm-controls select:focus { border-color: var(--accent); }
.utm-controls button { background: var(--accent); color: #04302f; font-weight: 700; border: none; border-radius: 8px; padding: 8px 20px; font-size: 13px; cursor: pointer; }
.utm-controls button:hover { background: var(--accent2); }

.utm-section { margin-bottom: 28px; }
.utm-section-title { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
.utm-section-title::after { content: ""; flex: 1; height: 1px; background: var(--line-dark); }

.utm-total { background: var(--bg2); border: 1px solid var(--line-dark); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
.utm-total .big { font-size: 18px; font-weight: 700; color: #fff; }
.utm-total .small { font-size: 12px; color: var(--muted); margin-top: 4px; }

.utm-table-wrap { background: var(--panel); color: var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); margin-top: 6px; }
.utm-table-wrap .scroll { overflow-x: auto; }
.utm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.utm-table thead th { background: var(--panel2); color: var(--ink-soft); text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.utm-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.utm-table tbody tr:last-child td { border-bottom: none; }
.utm-table tbody tr:hover { background: #f0f6f9; }
.utm-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.utm-table .label { font-weight: 600; color: var(--ink); max-width: 400px; }
.utm-table .marketer-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
.utm-table .marketer-jor { background: rgba(50,230,226,.14); color: #0a8a86; }
.utm-table .marketer-cha { background: rgba(245,165,36,.14); color: #a86a08; }
.utm-table .marketer-mo { background: rgba(48,164,108,.14); color: #1f7a4d; }
.utm-table .marketer-unt { background: rgba(138,153,173,.14); color: #5b6b7f; }

.cvr-high { color: var(--green); font-weight: 700; }
.cvr-mid { color: #a86a08; font-weight: 600; }
.cvr-low { color: var(--red); font-weight: 600; }
.cvr-target { font-size: 10px; color: var(--muted); margin-left: 4px; }

.flag { font-size: 11px; margin-left: 6px; }
.flag-green { color: var(--green); }
.flag-amber { color: var(--amber); }
.flag-red { color: var(--red); }

.dim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
.dim-card { background: var(--bg2); border: 1px solid var(--line-dark); border-radius: 10px; padding: 12px 14px; }
.dim-card h5 { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.dim-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line-dark); }
.dim-row:last-child { border-bottom: none; }
.dim-row .v { font-weight: 600; color: #fff; }
.dim-row .n { color: var(--muted); font-variant-numeric: tabular-nums; }

.loading-utm { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 0; }
.error-utm { text-align: center; color: var(--red); font-size: 14px; padding: 60px 0; }

@media (max-width: 820px) {
  .utm-controls-row { flex-direction: column; align-items: stretch; }
  .dim-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="gate-box">
    <img src="assets/logo.png" alt="Tort Claim Strategies">
    <div class="gate-sub">UTM Content Analysis</div>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-pw" placeholder="Team password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <div id="gate-err" class="gate-err hidden">Wrong password.</div>
  </div>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="Tort Claim Strategies">
      <div class="sub">UTM Content Analysis</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="index.html" style="color:var(--accent);font-size:12px;text-decoration:none;border:1px solid var(--line-dark);padding:6px 12px;border-radius:6px;">← Dashboard</a>
      <div class="fresh" id="fresh">Loading…</div>
    </div>
  </header>

  <div id="content">
    <div class="loading-utm">Loading UTM data…</div>
  </div>

  <footer id="footer">TCS Internal · UTM Content Analysis · <span class="amber-text">shared-password access</span></footer>
</div>

<script>
const TCS_DASH_PASSWORD = "tcs";
const AUTH_KEY = "tcs_utm_auth";

// Password gate
(function initGate() {
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const form = document.getElementById("gate-form");
  const pw = document.getElementById("gate-pw");
  const err = document.getElementById("gate-err");

  function unlock() {
    gate.classList.add("hidden");
    app.classList.remove("hidden");
    loadData();
  }

  if (sessionStorage.getItem(AUTH_KEY) === "1") { unlock(); return; }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (pw.value === TCS_DASH_PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, "1");
      unlock();
    } else {
      err.classList.remove("hidden");
      pw.value = "";
      pw.focus();
    }
  });
})();

let rawData = null;
let currentTort = "sma";
let currentWindow = "7d";

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return Number(v).toFixed(1).replace(/\.0$/, "") + "%";
}

function cvrClass(v, target) {
  if (v === null || v === undefined) return "";
  if (target && v >= target) return "cvr-high";
  if (v >= 15) return "cvr-high";
  if (v >= 8) return "cvr-mid";
  return "cvr-low";
}

function cvrFlag(v, target) {
  if (v === null || v === undefined) return "";
  if (target && v >= target) return '<span class="flag flag-green">✅</span>';
  if (v >= 25) return '<span class="flag flag-green">✅</span>';
  if (v >= 15) return '<span class="flag flag-amber">⚠️</span>';
  return '<span class="flag flag-red">🔴</span>';
}

function marketerTag(m) {
  const cls = m === "Jordan" ? "marketer-jor" : m === "Charlie" ? "marketer-cha" : m === "Morane" ? "marketer-mo" : "marketer-unt";
  const short = m === "Jordan" ? "JOR" : m === "Charlie" ? "CHA" : m === "Morane" ? "MO" : "UNT";
  return `<span class="marketer-tag ${cls}">${short}</span>`;
}

async function loadData() {
  try {
    const r = await fetch("utm_data.json?t=" + Date.now());
    if (!r.ok) throw new Error("No utm_data.json — run build_utm_data.py first");
    rawData = await r.json();
    document.getElementById("fresh").innerHTML = 
      `Data as of <b>${rawData.generated_at}</b>`;
    renderControls();
    renderAnalysis();
  } catch (e) {
    document.getElementById("content").innerHTML = 
      `<div class="error-utm">Failed to load data: ${esc(e.message)}<br><br>
       <small>Run: HOME=/Users/andyoc python3 build_utm_data.py</small></div>`;
  }
}

function renderControls() {
  const tortOptions = rawData.torts.map(t => 
    `<option value="${t.tort_id}" ${currentTort === t.tort_id ? "selected" : ""}>${t.tort_name}</option>`
  ).join("");
  
  const windowOptions = ["7d", "14d", "30d", "Lifetime"].map(w =>
    `<option value="${w}" ${currentWindow === w ? "selected" : ""}>${w}</option>`
  ).join("");
  
  const html = `
    <div class="utm-controls">
      <div class="utm-controls-row">
        <div>
          <label>Tort</label><br>
          <select id="filter-tort" onchange="currentTort=this.value; renderAnalysis()">${tortOptions}</select>
        </div>
        <div>
          <label>Window</label><br>
          <select id="filter-window" onchange="currentWindow=this.value; renderAnalysis()">${windowOptions}</select>
        </div>
        <div style="margin-left:auto">
          <button onclick="loadData()">↻ Refresh</button>
        </div>
      </div>
    </div>
    <div id="analysis"></div>
  `;
  document.getElementById("content").innerHTML = html;
}

function renderAnalysis() {
  const tort = rawData.torts.find(t => t.tort_id === currentTort);
  if (!tort) {
    document.getElementById("analysis").innerHTML = "<div class='error-utm'>Tort not found</div>";
    return;
  }
  
  const w = tort.windows[currentWindow];
  if (!w || !w.total) {
    document.getElementById("analysis").innerHTML = `<div class='error-utm'>No data for ${esc(currentWindow)} window</div>`;
    return;
  }
  
  const target = tort.target_cvr;
  let html = "";
  
  // TOTAL
  const totalPayable = w.total.payable || 0;
  const totalSigned = w.total.signed || 0;
  const totalCvr = w.total.cvr;
  html += `<div class="utm-section">
    <div class="utm-section-title">TOTAL — ${esc(tort.tort_name)} (${esc(w.range || currentWindow)})</div>
    <div class="utm-total">
      <div class="big">payable=${totalPayable.toLocaleString()} signed=${totalSigned.toLocaleString()} cvr=${fmtPct(totalCvr)}</div>
      ${target ? `<div class="small">Target CVR: ${target}% ${totalCvr >= target ? "✅" : "🔴"}</div>` : ""}
    </div>
  </div>`;
  
  // MARKETERS
  const marketers = w.marketers || [];
  if (marketers.length) {
    html += `<div class="utm-section">
      <div class="utm-section-title">Marketers</div>
      <div class="utm-table-wrap"><div class="scroll"><table class="utm-table">
        <thead><tr><th>Marketer</th><th class="num">Payable</th><th class="num">Signed</th><th class="num">CVR</th></tr></thead>
        <tbody>${marketers.map(m => `
          <tr>
            <td class="label">${marketerTag(m.name)} ${esc(m.name)}</td>
            <td class="num">${m.payable.toLocaleString()}</td>
            <td class="num">${m.signed.toLocaleString()}</td>
            <td class="num ${cvrClass(m.cvr, target)}">${fmtPct(m.cvr)} ${cvrFlag(m.cvr, target)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div></div>
    </div>`;
  }
  
  // CONCEPTS
  const concepts = w.concepts || [];
  if (concepts.length) {
    html += `<div class="utm-section">
      <div class="utm-section-title">Concepts ${tort.prefix} #</div>
      <div class="utm-table-wrap"><div class="scroll"><table class="utm-table">
        <thead><tr><th>Concept</th><th class="num">Payable</th><th class="num">Signed</th><th class="num">CVR</th></tr></thead>
        <tbody>${concepts.map(c => `
          <tr>
            <td class="label">${esc(c.concept)}</td>
            <td class="num">${c.payable.toLocaleString()}</td>
            <td class="num">${c.signed.toLocaleString()}</td>
            <td class="num ${cvrClass(c.cvr, target)}">${fmtPct(c.cvr)} ${cvrFlag(c.cvr, target)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div></div>
    </div>`;
  }
  
  // DIMENSIONS (criteria tokens)
  const dimensions = w.dimensions || {};
  const dimOrder = ['hook', 'concept', 'audience', 'visual', 'version', 'suffix', 'format'];
  const dimNames = {hook: 'Hook', concept: 'Concept', audience: 'Audience', visual: 'Visual', version: 'Version', suffix: 'Suffix', format: 'Format'};
  let dimHtml = "";
  for (const dn of dimOrder) {
    const rows = dimensions[dn];
    if (!rows || !rows.length) continue;
    dimHtml += `<div class="dim-card">
      <h5>${dimNames[dn] || dn}</h5>
      ${rows.map(r => `
        <div class="dim-row">
          <span class="v">${esc(r.value)}</span>
          <span class="n">p=${r.payable} s=${r.signed} ${fmtPct(r.cvr)}</span>
        </div>`).join("")}
    </div>`;
  }
  if (dimHtml) {
    html += `<div class="utm-section">
      <div class="utm-section-title">Criteria Tokens</div>
      <div class="dim-grid">${dimHtml}</div>
    </div>`;
  }
  
  // CREATIVES
  const creatives = w.creatives || [];
  if (creatives.length) {
    html += `<div class="utm-section">
      <div class="utm-section-title">Creatives (≥5 payable)</div>
      <div class="utm-table-wrap"><div class="scroll"><table class="utm-table">
        <thead><tr><th>Creative</th><th class="num">Payable</th><th class="num">Signed</th><th class="num">CVR</th></tr></thead>
        <tbody>${creatives.map(c => `
          <tr>
            <td class="label">${marketerTag(c.marketer)} ${esc(c.label)}</td>
            <td class="num">${c.payable.toLocaleString()}</td>
            <td class="num">${c.signed.toLocaleString()}</td>
            <td class="num ${cvrClass(c.cvr, target)}">${fmtPct(c.cvr)} ${cvrFlag(c.cvr, target)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div></div>
    </div>`;
  }
  
  document.getElementById("analysis").innerHTML = html;
}
</script>
</body>
</html>
