<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTM Content Analysis — TCS</title>
<link rel="stylesheet" href="styles.css">
<style>
/* UTM Analysis specific styles */
.utm-controls { background: var(--bg2); border: 1px solid var(--line-dark); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; }
.utm-controls-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.utm-controls label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.utm-controls select, .utm-controls input { background: #0b0e13; border: 1px solid var(--line-dark); border-radius: 8px; color: #e8eef5; padding: 8px 12px; font-size: 13px; outline: none; }
.utm-controls select:focus, .utm-controls input:focus { border-color: var(--accent); }
.utm-controls button { background: var(--accent); color: #04302f; font-weight: 700; border: none; border-radius: 8px; padding: 8px 20px; font-size: 13px; cursor: pointer; }
.utm-controls button:hover { background: var(--accent2); }

.utm-table-wrap { background: var(--panel); color: var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); margin-top: 6px; }
.utm-table-wrap .scroll { overflow-x: auto; }
.utm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.utm-table thead th { background: var(--panel2); color: var(--ink-soft); text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.utm-table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.utm-table tbody tr:last-child td { border-bottom: none; }
.utm-table tbody tr:hover { background: #f0f6f9; }
.utm-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.utm-table .script { font-weight: 700; color: var(--ink); }
.utm-table .family { color: var(--accent); font-weight: 600; }
.utm-table .cvr-high { color: var(--green); font-weight: 700; }
.utm-table .cvr-mid { color: #a86a08; font-weight: 600; }
.utm-table .cvr-low { color: var(--red); font-weight: 600; }
.utm-table .variations { font-size: 11px; color: var(--ink-soft); max-width: 300px; }

.utm-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.utm-stat { background: var(--bg2); border: 1px solid var(--line-dark); border-radius: 12px; padding: 14px 16px; }
.utm-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.utm-stat .v { font-size: 24px; font-weight: 700; color: #fff; margin-top: 4px; }
.utm-stat .d { font-size: 11.5px; margin-top: 3px; color: var(--muted); }

.loading-utm { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 0; }
.error-utm { text-align: center; color: var(--red); font-size: 14px; padding: 60px 0; }

@media (max-width: 820px) {
  .utm-summary { grid-template-columns: repeat(2, 1fr); }
  .utm-controls-row { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="gate-box">
    <img src="assets/logo.png" alt="Tort Claim Strategies">
    <div class="gate-sub">UTM Content Analysis</div>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-pw" placeholder="Team password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <div id="gate-err" class="gate-err hidden">Wrong password.</div>
  </div>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="Tort Claim Strategies">
      <div class="sub">UTM Content Analysis</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="index.html" style="color:var(--accent);font-size:12px;text-decoration:none;border:1px solid var(--line-dark);padding:6px 12px;border-radius:6px;">← Dashboard</a>
      <div class="fresh" id="fresh">Loading…</div>
    </div>
  </header>

  <div id="content">
    <div class="loading-utm">Loading UTM data from BP sheets…</div>
  </div>

  <footer id="footer">TCS Internal · UTM Content Analysis · <span class="amber-text">shared-password access</span></footer>
</div>

<script>
const TCS_DASH_PASSWORD = "tcs";
const AUTH_KEY = "tcs_utm_auth";

// Password gate
(function initGate() {
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const form = document.getElementById("gate-form");
  const pw = document.getElementById("gate-pw");
  const err = document.getElementById("gate-err");

  function unlock() {
    gate.classList.add("hidden");
    app.classList.remove("hidden");
    loadData();
  }

  if (sessionStorage.getItem(AUTH_KEY) === "1") { unlock(); return; }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (pw.value === TCS_DASH_PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, "1");
      unlock();
    } else {
      err.classList.remove("hidden");
      pw.value = "";
      pw.focus();
    }
  });
})();

// Data
let rawData = null;
let currentTort = "all";
let currentMinSigns = 3;
let currentGroupBy = "family"; // "family" or "individual"

const TORTS = [
  { id: "sma", name: "Social Media Addiction", prefix: "SMA", tab: "Social Media Addiction" },
  { id: "hm", name: "Hernia Mesh", prefix: "HM", tab: "Hernia Mesh" },
  { id: "end", name: "Endoscopy", prefix: "END", tab: "Endoscopy" },
  { id: "pp", name: "PowerPort", prefix: "PP", tab: "PowerPort" },
  { id: "pqt", name: "Paraquat", prefix: "PQT", tab: "Paraquat" },
  { id: "sil", name: "Silicosis", prefix: "SIL", tab: "Silicosis" },
  { id: "jdc", name: "JDC IL", prefix: "JDC", tab: "Juvenile Detention Center - IL" },
  { id: "talc", name: "Talcum", prefix: "TALC", tab: "Talcum Powder" },
  { id: "bm", name: "Breast Mesh", prefix: "BM", tab: "Breast Mesh" },
  { id: "tvm", name: "Transvaginal Mesh", prefix: "TVM", tab: "Transvaginal Mesh" },
  { id: "chlor", name: "Chlorpyrifos", prefix: "CHLOR", tab: "Chlorpyrifos" }
];

const NONPAY = ["rejected - failed prequalification", "rejected - wrong number", "rejected - existing contact"];

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return Number(v).toFixed(1).replace(/\.0$/, "") + "%";
}

function extractScriptNumber(label, prefix) {
  if (!label) return null;
  // Exclude long numeric-only adSetIds (10+ digits)
  if (/^\d{10,}$/.test(label.trim())) return null;
  // Match: PREFIX (number) or PREFIX number or PREFIX(number)
  const re = new RegExp(prefix + "\\s*\\(?([0-9]{1,3})(?:-[0-9]+)?\\)?", "i");
  const m = label.match(re);
  if (m) return m[1];
  // IT- prefix
  const re2 = new RegExp(prefix + "\\s*\\(?IT-([0-9]+)", "i");
  const m2 = label.match(re2);
  if (m2) return "IT-" + m2[1];
  return null;
}

function resolveLabel(row) {
  // Priority: adSetId (if non-numeric) → UTM_Content → keyword → UTM_Campaign → UTM_Medium → campaignId → (blank)
  const adset = (row.adSetId || "").trim();
  if (adset && !/^\d{10,}$/.test(adset)) return adset;
  const utm = (row.UTM_Content || "").trim();
  if (utm) return utm;
  const kw = (row.keyword || "").trim();
  if (kw) return kw;
  const camp = (row.UTM_Campaign || "").trim();
  if (camp) return camp;
  const med = (row.UTM_Medium || "").trim();
  if (med) return med;
  const cid = (row.campaignId || "").trim();
  if (cid) return cid;
  return "(blank)";
}

async function loadData() {
  try {
    // Load the pre-built dataset (we'll generate this via a build script)
    const r = await fetch("utm_data.json?t=" + Date.now());
    if (!r.ok) throw new Error("No utm_data.json — run the build script first");
    rawData = await r.json();
    document.getElementById("fresh").innerHTML = 
      `Data as of <b>${rawData.generated_at}</b> · ${rawData.total_rows.toLocaleString()} rows across ${rawData.torts.length} torts`;
    renderControls();
    renderTable();
  } catch (e) {
    document.getElementById("content").innerHTML = 
      `<div class="error-utm">Failed to load data: ${esc(e.message)}<br><br>
       <small>Run the build script to generate utm_data.json</small></div>`;
  }
}

function renderControls() {
  const tortOptions = [`<option value="all">All Torts</option>`].concat(
    TORTS.map(t => `<option value="${t.id}" ${currentTort === t.id ? "selected" : ""}>${t.name}</option>`)
  ).join("");
  
  const html = `
    <div class="utm-controls">
      <div class="utm-controls-row">
        <div>
          <label>Tort</label><br>
          <select id="filter-tort" onchange="currentTort=this.value; renderTable()">${tortOptions}</select>
        </div>
        <div>
          <label>Min Signs</label><br>
          <select id="filter-min" onchange="currentMinSigns=parseInt(this.value); renderTable()">
            <option value="1" ${currentMinSigns===1?"selected":""}>1+</option>
            <option value="3" ${currentMinSigns===3?"selected":""}>3+</option>
            <option value="5" ${currentMinSigns===5?"selected":""}>5+</option>
            <option value="8" ${currentMinSigns===8?"selected":""}>8+</option>
          </select>
        </div>
        <div>
          <label>Group By</label><br>
          <select id="filter-group" onchange="currentGroupBy=this.value; renderTable()">
            <option value="family" ${currentGroupBy==="family"?"selected":""}>Script Family</option>
            <option value="individual" ${currentGroupBy==="individual"?"selected":""}>Individual Variant</option>
          </select>
        </div>
        <div style="margin-left:auto">
          <button onclick="loadData()">↻ Refresh</button>
        </div>
      </div>
    </div>
    <div class="utm-summary" id="summary"></div>
    <div id="table-container"></div>
  `;
  document.getElementById("content").innerHTML = html;
}

function renderTable() {
  if (!rawData) return;
  
  // Filter and aggregate
  let rows = rawData.rows;
  if (currentTort !== "all") {
    rows = rows.filter(r => r.tort_id === currentTort);
  }
  
  // Group by script family or individual
  const groups = {};
  for (const row of rows) {
    const label = resolveLabel(row);
    let key;
    if (currentGroupBy === "family") {
      const tort = TORTS.find(t => t.id === row.tort_id);
      const num = extractScriptNumber(label, tort ? tort.prefix : "");
      key = num ? `${tort.prefix} ${num}` : label;
    } else {
      key = label;
    }
    
    if (!groups[key]) {
      groups[key] = { 
        key, 
        tort: row.tort_name,
        tort_id: row.tort_id,
        leads: 0, 
        payable: 0, 
        signed: 0, 
        variations: new Set(),
        buyers: {}
      };
    }
    const g = groups[key];
    g.leads++;
    if (row.payable) g.payable++;
    if (row.signed) g.signed++;
    g.variations.add(label);
    
    // Track buyer split
    const buyer = row.buyer || "Unknown";
    if (!g.buyers[buyer]) g.buyers[buyer] = { leads: 0, payable: 0, signed: 0 };
    g.buyers[buyer].leads++;
    if (row.payable) g.buyers[buyer].payable++;
    if (row.signed) g.buyers[buyer].signed++;
  }
  
  // Convert to array and filter by min signs
  let items = Object.values(groups).filter(g => g.signed >= currentMinSigns);
  
  // Sort by CVR desc, then signed desc
  items.sort((a, b) => {
    const cvrA = a.payable > 0 ? a.signed / a.payable : 0;
    const cvrB = b.payable > 0 ? b.signed / b.payable : 0;
    if (cvrB !== cvrA) return cvrB - cvrA;
    return b.signed - a.signed;
  });
  
  // Summary stats
  const totalLeads = items.reduce((s, g) => s + g.leads, 0);
  const totalPayable = items.reduce((s, g) => s + g.payable, 0);
  const totalSigned = items.reduce((s, g) => s + g.signed, 0);
  const avgCVR = totalPayable > 0 ? (totalSigned / totalPayable * 100) : 0;
  
  document.getElementById("summary").innerHTML = `
    <div class="utm-stat"><div class="l">Scripts Shown</div><div class="v">${items.length}</div></div>
    <div class="utm-stat"><div class="l">Total Leads</div><div class="v">${totalLeads.toLocaleString()}</div></div>
    <div class="utm-stat"><div class="l">Payable</div><div class="v">${totalPayable.toLocaleString()}</div></div>
    <div class="utm-stat"><div class="l">Signed</div><div class="v">${totalSigned.toLocaleString()}</div><div class="d">${fmtPct(avgCVR)} CVR</div></div>
  `;
  
  // Table
  const rowsHtml = items.map((g, i) => {
    const cvr = g.payable > 0 ? (g.signed / g.payable * 100) : 0;
    const cvrClass = cvr >= 15 ? "cvr-high" : cvr >= 8 ? "cvr-mid" : "cvr-low";
    const variations = Array.from(g.variations).slice(0, 3).join("; ");
    const moreVar = g.variations.size > 3 ? ` +${g.variations.size - 3} more` : "";
    
    // Buyer breakdown tooltip
    const buyerStr = Object.entries(g.buyers)
      .map(([b, d]) => `${b}: ${d.signed}/${d.payable} (${d.payable > 0 ? (d.signed/d.payable*100).toFixed(1) : 0}%)`)
      .join(" | ");
    
    return `<tr>
      <td class="num">${i + 1}</td>
      <td class="script">${esc(g.key)}</td>
      <td>${esc(g.tort)}</td>
      <td class="num">${g.leads.toLocaleString()}</td>
      <td class="num">${g.payable.toLocaleString()}</td>
      <td class="num">${g.signed.toLocaleString()}</td>
      <td class="num ${cvrClass}">${fmtPct(cvr)}</td>
      <td class="variations" title="${esc(buyerStr)}">${esc(variations)}${moreVar}</td>
    </tr>`;
  }).join("");
  
  document.getElementById("table-container").innerHTML = `
    <div class="utm-table-wrap">
      <div class="scroll">
        <table class="utm-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Script</th>
              <th>Tort</th>
              <th class="num">Leads</th>
              <th class="num">Payable</th>
              <th class="num">Signed</th>
              <th class="num">CVR</th>
              <th>Variations (hover for buyer split)</th>
            </tr>
          </thead>
          <tbody>${rowsHtml || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:40px">No scripts meet the min-signs threshold (${currentMinSigns}+)</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
